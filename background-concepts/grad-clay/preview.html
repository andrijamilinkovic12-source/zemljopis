<!doctype html>
<html lang="sr-Latn"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grad · 3D Soft Clay Mat</title>
<base href="../../www/">
<style>
html,body{margin:0;height:100%;background:#17233e}
body{display:grid;place-items:center}
main{height:min(100dvh,177.68vw);aspect-ratio:941/1672;background:center/100% 100% url(assets/grad-clay/poster.png)}
canvas{display:block;width:100%;height:100%}canvas[hidden]{display:none}
nav{position:fixed;bottom:.65rem;display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem}
button{font:600 14px system-ui;color:#faf6ee;background:#252a3c;border:1px solid #72768a;border-radius:1rem;padding:.45rem .8rem;cursor:pointer}
</style>
<main aria-label="Gradski trg sa fontanom, kulom i pokretnim oblacima"></main>
<nav aria-label="Prikaži deo ciklusa"><button value="0">Od početka</button><button value="240">Izlazak meseca</button><button value="260">Puna noć</button><button value="275">Zalazak meseca</button></nav>
<script src="grad-live-canvas.js?v=5"></script>
<script>
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const scene = document.querySelector('main');
let selected = 0;
GradLiveCanvas.seek(selected);
function still() {
    const stills = {240:'moonrise-still',260:'night',275:'moonset-still'};
    scene.style.backgroundImage = selected === 0 ? '' : 'url(../background-concepts/grad-clay/'+stills[selected]+'.png?v=5)';
}
document.querySelector('nav').addEventListener('click',event=>{
    if (event.target.tagName !== 'BUTTON') return;
    selected = Number(event.target.value);
    GradLiveCanvas.seek(selected);
    if (motion.matches) still();
});
function sync(){
    if(document.hidden || motion.matches) {
        GradLiveCanvas.hide();
        if (motion.matches) still();
    } else {
        scene.style.backgroundImage = '';
        GradLiveCanvas.show(scene);
    }
}
document.addEventListener('visibilitychange',sync);
motion.addEventListener('change',sync);
sync();
</script></html>
