<!doctype html>
<html lang="sr-Latn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reka · 3D Soft Clay Mat</title>
<base href="../../www/">
<style>
html,body{margin:0;height:100%;background:#143b43}
body{display:grid;place-items:center}
main{height:min(100dvh,177.68vw);aspect-ratio:941/1672;background:center/100% 100% url(assets/reka-clay/poster.png?v=3)}
canvas{display:block;width:100%;height:100%}canvas[hidden]{display:none}
nav{position:fixed;bottom:max(.65rem,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem}
button{font:600 14px system-ui;color:white;background:#254449;border:1px solid #9bb7ad;border-radius:1rem;padding:.45rem .8rem;cursor:pointer}
</style>
<main aria-label="Reka sa lokvanjima, ribom i četiri oblaka na zalasku sunca"></main>
<nav aria-label="Pregled animacije">
    <button value="0">Od početka</button>
    <button value="16">Skok ribe</button>
    <button value="75">Žarko sunce</button>
</nav>
<script src="reka-lily-tracks.js?v=1"></script>
<script src="reka-live-canvas.js?v=3"></script>
<script>
const scene = document.querySelector('main');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
function sync() {
    RekaLiveCanvas.hide();
    if (!document.hidden) RekaLiveCanvas.show(scene,!motion.matches);
}
document.querySelector('nav').addEventListener('click', event => {
    if (event.target.tagName !== 'BUTTON') return;
    const time = Number(event.target.value);
    RekaLiveCanvas.seek(time === 16 && motion.matches ? 16.9 : time);
});
document.addEventListener('visibilitychange',sync);
motion.addEventListener('change',sync);
sync();
</script>
</html>
